<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="polly">
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="CanPowerOff"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="CanReboot"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="PowerOff"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="Reboot"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="Suspend"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="Hibernate"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="HybridSleep"/>
    <deny send_destination="org.freedesktop.login1" send_interface="org.freedesktop.login1.Manager" send_member="SuspendThenHibernate"/>
  </policy>
</busconfig>
