set timeout=8
set default=0
serial --unit=0 --speed=115200
terminal_output console serial
menuentry "PollyDesktop Live - baseline (DRM + CPU rendering, memory only)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init loglevel=5 polly.mode=baseline
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
menuentry "PollyDesktop Live - GPU acceleration (automatic DRM selection)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init loglevel=5 polly.mode=gpu
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
menuentry "PollyDesktop Live - Intel-only GPU (display must connect to motherboard)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init loglevel=5 polly.mode=gpu polly.gpu=intel
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
menuentry "PollyDesktop Live - diagnostics console (no automatic desktop)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init loglevel=5 polly.mode=console
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
menuentry "PollyDesktop Live - serial VM baseline" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init loglevel=5 polly.mode=baseline polly.serial=1
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
