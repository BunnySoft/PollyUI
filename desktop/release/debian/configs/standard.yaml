schemaVersion: 1
name: standard
description: Standard desktop with the complete existing general-purpose driver and firmware selection, not all-hardware certification.
target: {distribution: debian13, architecture: x86_64}
hardware: standard
media: live-iso-usb
nativeVariant: standard-effects4
capabilities: {renderer: raster, webgl2: true, vulkan: true, fonts: wide, ime: luna-pinyin, audio: standard}
packageGroups:
  - description: Signature verification for offline media assembly
    stage: runtime
    install: [gpgv]
  - description: Native runtime roots, including Chinese IME and broad fonts
    stage: runtime
    install: [dbus-daemon, dbus-bin, pipewire-bin, libspa-0.2-modules, file, libmagic1t64, libmagic-mgc, python3, libegl1, libegl-mesa0, libgl1, libgl1-mesa-dri, mesa-vulkan-drivers, libgles2, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, xkb-data, adwaita-icon-theme, fonts-dejavu-core, fonts-noto-core, fonts-noto-cjk, fonts-noto-color-emoji, librime-data, rime-data-luna-pinyin, libinput-bin, foot, ca-certificates]
  - description: System services and general-purpose hardware
    stage: platform
    install: [systemd-sysv, udev, dbus, libpam-systemd, polkitd=126-2, python3, kmod, intel-microcode, iucode-tool, iwd, dhcpcd, openresolv, wireless-regdb, iproute2, iw, rfkill, ethtool, pciutils, usbutils, alsa-utils, util-linux, linux-image-amd64, firmware-intel-graphics, firmware-nvidia-graphics, firmware-amd-graphics, firmware-iwlwifi, firmware-sof-signed, firmware-realtek]
  - description: Additional common Wi-Fi and audio firmware and ALSA hardware configuration
    stage: platform
    install: [firmware-atheros, firmware-brcm80211, firmware-mediatek, firmware-intel-sound, firmware-cirrus, alsa-ucm-conf, alsa-topology-conf]
  - description: Ordinary command-line tools and network diagnostics, clients only
    stage: platform
    install: [bash, coreutils, findutils, grep, sed, gawk, procps, psmisc, less, nano, vim-tiny, tar, gzip, bzip2, xz-utils=5.8.1-1+deb13u1, unzip, zip, curl=8.14.1-2+deb13u5, wget, openssh-client, rsync, lsof, iputils-ping, iputils-tracepath, traceroute, bind9-dnsutils, file, git, ca-certificates]
  - description: Pinned early graphical splash
    stage: boot
    install: [plymouth=24.004.60-5, libplymouth5=24.004.60-5, plymouth-label=24.004.60-5]
policy: {noRecommends: true, forbidden: [], pins: []}
