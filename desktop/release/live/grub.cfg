set timeout=2
set default=0
serial --unit=0 --speed=115200
terminal_output console serial
menuentry "PollyDesktop alpha Live (memory only)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init loglevel=5
    initrd /boot/initramfs.gz
}
