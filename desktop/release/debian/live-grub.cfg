menuentry "Live - Intel GPU (motherboard display connector)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=gpu polly.gpu=intel polly.splash=1
    initrd /boot/intel-ucode.img /boot/initramfs.gz
