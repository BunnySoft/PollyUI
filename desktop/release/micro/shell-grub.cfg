set timeout=0
set default=0
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    insmod gfxterm
    loadfont /boot/grub/ascii.pf2
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi
menuentry "Polly Micro Shell" {
    linux /boot/vmlinuz console=tty0 console=ttyS0
    initrd /boot/initramfs.gz
}
