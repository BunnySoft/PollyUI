set timeout=8
set timeout_style=menu
set default=0
serial --unit=0 --speed=115200
terminal_output console serial
unset theme
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
set gfxmode=1280x800,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set polly_graphics_modules=0
if insmod all_video; then
    if insmod gfxterm; then
        if insmod gfxmenu; then
            if insmod png; then
                set polly_graphics_modules=1
            fi
        fi
    fi
fi
if [ "$polly_graphics_modules" = 1 ]; then
    set polly_graphics_ready=0
    if loadfont $prefix/fonts/unicode.pf2; then
        if [ -f $prefix/themes/polly/theme.txt ]; then
            if terminal_output gfxterm; then
                set theme=$prefix/themes/polly/theme.txt
                export theme
                terminal_output gfxterm serial
                set polly_graphics_ready=1
            fi
        fi
    fi
    if [ "$polly_graphics_ready" = 0 ]; then
        terminal_output console serial
        echo "Polly: graphics/font/theme unavailable; using the text boot menu."
    fi
else
    terminal_output console serial
    echo "Polly: graphics modules unavailable; using the text boot menu."
fi
function polly_start {
    echo "Polly: Loading kernel..."
    if linux /boot/vmlinuz "$@"; then
        echo "Polly: Loading bootstrap..."
        if initrd /boot/intel-ucode.img /boot/initramfs.gz; then
            echo "Polly: Starting kernel..."
        else
            echo "Polly ERROR: bootstrap loading failed; boot stopped."
            halt
        fi
    else
        echo "Polly ERROR: kernel loading failed; boot stopped."
        halt
    fi
}
function polly_prepare_media {
    if ! search --no-floppy --file --set=root /polly/@POLLY_MEDIA_ID@.marker; then
        echo "Polly ERROR: cannot find this build's boot filesystem."
        return 1
    fi
    if [ ! -f ($root)/polly/@POLLY_MEDIA_ID@.marker ]; then
        echo "Polly ERROR: this boot device does not match the bootstrap."
        return 1
    fi
    if ! probe --set=polly_media_uuid --fs-uuid ($root); then
        echo "Polly ERROR: cannot read the boot filesystem UUID."
        return 1
    fi
}
menuentry "Start PollyDesktop Live (memory only)" --class polly --id polly-live {
    if polly_prepare_media; then
    polly_start console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=baseline polly.splash=1 polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
    fi
}
submenu "Advanced startup" --class advanced --id polly-advanced {
    set default=0
    set timeout=-1
    menuentry "GPU acceleration (automatic selection)" --class gpu --id polly-gpu {
        if polly_prepare_media; then
        polly_start console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=gpu polly.splash=1 polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
        fi
    }
    menuentry "Intel GPU (motherboard display)" --class gpu --id polly-intel {
        if polly_prepare_media; then
        polly_start console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=gpu polly.gpu=intel polly.splash=1 polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
        fi
    }
    menuentry "Verbose startup (no splash)" --class verbose --id polly-verbose {
        if polly_prepare_media; then
        polly_start console=tty0 rdinit=/init loglevel=7 systemd.show_status=yes polly.mode=baseline polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
        fi
    }
    menuentry "Diagnostics console (no desktop)" --class console --id polly-console {
        if polly_prepare_media; then
        polly_start console=tty0 rdinit=/init loglevel=7 systemd.show_status=yes polly.mode=console polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
        fi
    }
    menuentry "Live - serial VM baseline" --class serial --id polly-serial {
        if polly_prepare_media; then
        polly_start console=tty0 console=ttyS0,115200 rdinit=/init loglevel=5 systemd.show_status=yes polly.mode=baseline polly.serial=1 polly.media_uuid=$polly_media_uuid polly.media_id=@POLLY_MEDIA_ID@
        fi
    }
}
