context.properties = {
    core.daemon = true
    core.name = polly-audio
    support.dbus = false
    default.clock.rate = 48000
    default.clock.quantum = 256
    link.max-buffers = 16
}
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt = audioconvert/libspa-audioconvert
    audiotestsrc = audiotestsrc/libspa-audiotestsrc
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = adapter args = {
        factory.name = audiotestsrc
        node.name = Polly-Test-Source
        node.description = "Polly synthetic source"
        media.class = Audio/Source
        audio.channels = 2
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    } }
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Polly-Test-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = Polly-Test-A
        node.description = "Polly test output A"
        media.class = Audio/Sink
        priority.session = 200
        audio.channels = 2
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = Polly-Test-B
        node.description = "Polly test output B"
        media.class = Audio/Sink
        priority.session = 100
        audio.channels = 2
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    } }
]
