[Unit]
Requires=polly-storage.service
After=polly-storage.service

[Service]
# iwd's automatic directory creation must not stand in for required state.
User=root
Group=root
StateDirectory=
Environment=STATE_DIRECTORY=/var/lib/iwd
RuntimeDirectory=polly-network-state
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
UMask=0077
ReadWritePaths=/var/lib/iwd
# The fixed hooks need the real mount view for Storage.check(), not iwd's
# ProtectSystem=strict read-only view. The daemon cannot write the snapshots.
ExecStartPre=+/usr/lib/polly-network/state.py load
ExecStopPost=+/usr/lib/polly-network/state.py save
