set timeout=8
set default=0
serial --unit=0 --speed=115200
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set gfxmode=auto
set gfxpayload=keep
if loadfont $prefix/fonts/unicode.pf2; then
    set theme=$prefix/themes/polly/theme.txt
    export theme
    if terminal_output gfxterm; then
        terminal_output gfxterm serial
    else
        terminal_output console serial
    fi
else
    terminal_output console serial
fi
menuentry "Start PollyDesktop Live (memory only)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=baseline polly.splash=1
    initrd /boot/intel-ucode.img /boot/initramfs.gz
}
menuentry "Live - GPU acceleration (automatic DRM selection)" {
    search --no-floppy --file --set=root /polly-live.marker
    linux /boot/vmlinuz console=tty0 rdinit=/init quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=auto udev.log_level=3 polly.mode=gpu polly.splash=1
    initrd /boot/intel-ucode.img /boot/initramfs.gz
